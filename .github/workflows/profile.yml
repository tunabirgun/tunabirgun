name: profile

on:
  schedule:
    - cron: '0 21 * * *' # 00:00 Europe/Istanbul, so the uptime day rolls over at local midnight
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile.yml']

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Build profile card
        run: node scripts/build-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: Refresh profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
